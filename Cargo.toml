[workspace]
members = [
    "crates/cardano-crypto",
    "crates/cardano-consensus",
    "crates/cardano-ledger",
    "crates/cardano-network",
    "crates/cardano-storage",
    "crates/cardano-tracing",
    "crates/cardano-api",
    "crates/cardano-node",
    "crates/cardano-testnet",
]
resolver = "2"

[workspace.package]
version = "10.5.1"
edition = "2021"
rust-version = "1.75"
authors = ["Cardano Rust Team"]
license = "Apache-2.0"
repository = "https://github.com/cardano-rust/cardano-node-rust"
homepage = "https://cardano.org"
description = "Cardano Node implementation in Rust"
keywords = ["cardano", "blockchain", "cryptocurrency", "consensus", "ouroboros"]
categories = ["cryptography", "network-programming", "development-tools"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
tokio-test = "0.4"
futures = "0.3"
async-trait = "0.1"

# Serialization and data formats
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
minicbor = { version = "0.24", features = ["derive", "std"] }
hex = "0.4"
bytes = "1.10"

# Cryptography
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
blake2 = "0.10"
sha2 = "0.10"
blstrs = "0.7"
ff = "0.13"
group = "0.13"
curve25519-dalek = { version = "4.0", features = ["digest"] }
subtle = "2.5"
zeroize = "1.7"
once_cell = "1.19"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

# Cardano Base Rust - Official VRF implementation
cardano-vrf-pure = { git = "https://github.com/FractionEstate/cardano-base-rust", branch = "master" }
cardano-crypto-class = { git = "https://github.com/FractionEstate/cardano-base-rust", branch = "master" }

# Database and storage
lmdb = "0.8"
rocksdb = "0.21"

# Networking
socket2 = "0.5"
mio = "0.8"

# Collections and data structures
indexmap = "2.11"

# Numeric operations
num-bigint = "0.4"
num-traits = "0.2"

# Time handling
chrono = "0.4"

# Web framework and HTTP
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.7"

# Error handling and logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Testing
proptest = "1.8"
criterion = "0.5"
tempfile = "3.23"
hex-literal = "0.4"

# Development dependencies
clap = { version = "4.5", features = ["derive"] }
config = "0.14"

# TUI and CLI enhancements
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.10"

# WebSocket
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
