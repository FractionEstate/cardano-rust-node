[package]
name = "cardano-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cardano cryptographic operations - Ed25519, VRF, hashing"
keywords = ["cardano", "cryptography", "ed25519", "vrf", "blake2"]

[features]
# Optional features from vendored cardano-base-rust code
# These features are not currently used but are referenced in conditional compilation
serde = []
kes-metrics = []
mlocked-metrics = []
vrf-debug = []
field-h2c-experimental = []

[dependencies]
# Cryptographic primitives
ed25519-dalek.workspace = true
blake2.workspace = true
sha2.workspace = true
blstrs.workspace = true
ff.workspace = true
group.workspace = true
curve25519-dalek = { version = "4.0", features = ["digest"] }
subtle = "2.5"
zeroize = "1.7"
once_cell = "1.19"

# Serialization
minicbor.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Random number generation
rand_core.workspace = true
rand.workspace = true
getrandom.workspace = true

# Additional dependencies for vendored crypto modules
digest = "0.10"
libc = "0.2"
ripemd = "0.1"
sha3 = "0.10"
num-bigint.workspace = true
num-traits.workspace = true

[dev-dependencies]
tempfile = "3.10"
proptest.workspace = true
hex-literal.workspace = true
