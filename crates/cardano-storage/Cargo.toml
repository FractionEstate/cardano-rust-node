[package]
name = "cardano-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cardano blockchain and ledger state storage backends"
keywords = ["cardano", "storage", "database", "lmdb"]

[dependencies]
# OLD Database backends (to be phased out - made optional)
lmdb = { workspace = true, optional = true }

# NEW: Pure Rust dependencies from cardano-base-rust
cardano-slotting = { git = "https://github.com/FractionEstate/cardano-base-rust", branch = "master" }
cardano-binary = { git = "https://github.com/FractionEstate/cardano-base-rust", branch = "master" }
cardano-crypto-class = { git = "https://github.com/FractionEstate/cardano-base-rust", branch = "master" }

# NEW: Pure Rust storage engine dependencies
memmap2 = "0.9" # Memory-mapped I/O for zero-copy reads
# Note: zstd compression will be added in Phase 2 after resolving build dependencies
# For now, compression is optional and can be disabled in config
bincode = "2.0.1"    # Fast binary serialization
hashbrown = "0.16.0" # Fast HashMap implementation
crossbeam = "0.8"    # Lock-free data structures
blake2 = "0.10"      # Blake2b hashing

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
minicbor.workspace = true
hex = { workspace = true }                          # For hex encoding/decoding

# Internal dependencies
cardano-ledger = { path = "../cardano-ledger" }
cardano-crypto = { path = "../cardano-crypto" }

# Error handling and logging
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

# Async operations
tokio.workspace = true
async-trait.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
hex = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "ring_buffer"
harness = false

[[bench]]
name = "hash_ops"
harness = false

[[bench]]
name = "serialization"
harness = false

[features]
default = ["cardanodb"]
cardanodb = []               # New pure-Rust storage engine
legacy = ["lmdb"] # Legacy C/C++ backend

# Uncomment when benchmarks are ready
# [[bench]]
# name = "cardanodb_benchmarks"
# harness = false
