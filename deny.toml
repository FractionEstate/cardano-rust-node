# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
# TODO: Replace these unmaintained dependencies
# - lmdb -> lmdb-rkv (https://github.com/mozilla/lmdb-rs)
# - paste -> pastey (https://crates.io/crates/pastey)
# - serde_cbor -> ciborium or minicbor
ignore = [
    "RUSTSEC-2022-0001", # lmdb unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2021-0127", # serde_cbor unmaintained
]

[licenses]
# Allow OSI/FSF free software licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BlueOak-1.0.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/FractionEstate/cardano-base-rust"]
