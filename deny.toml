# cargo-deny configuration
# https://github.com/EmbarkStudios/cargo-deny

[advisories]
# Deny security vulnerabilities
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
ignore = []

[licenses]
# Allow these licenses
version = 2
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
]
deny = [
    "GPL-1.0",
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-1.0",
    "AGPL-3.0",
]
copyleft = "warn"
allow-osi-fsf-free = "both"
confidence-threshold = 0.8

[licenses.private]
# Accept our own private packages
ignore = false

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Skip these crates when checking for multiple versions
skip = []

skip-tree = []

[sources]
# Deny unknown registry sources
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/FractionEstate/cardano-base-rust",
]

[sources.allow-org]
github = ["FractionEstate"]
