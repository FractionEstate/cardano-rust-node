[package]
name = "cardano-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cardano Node main executable"
keywords = ["cardano", "node", "blockchain", "executable"]

[[bin]]
name = "cardano-node"
path = "src/main.rs"

[lib]
name = "cardano_node"
path = "src/lib.rs"

[dependencies]
# CLI framework
clap.workspace = true

# Configuration
config.workspace = true

# Async runtime
tokio = { workspace = true, features = ["signal", "time"] }

# Internal dependencies
cardano-consensus = { path = "../cardano-consensus" }
cardano-ledger = { path = "../cardano-ledger" }
cardano-network = { path = "../cardano-network" }
cardano-storage = { path = "../cardano-storage" }
cardano-tracing = { path = "../cardano-tracing" }
cardano-api = { path = "../cardano-api" }

# Error handling and logging
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Testing utilities (used by ConfigTestHelper)
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
futures.workspace = true
tokio-test.workspace = true

[[test]]
name = "t082_node_lifecycle"
path = "../../tests/t082_node_lifecycle.rs"
