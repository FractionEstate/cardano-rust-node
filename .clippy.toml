# Clippy Configuration for Cardano Rust Node
#
# This file configures clippy lints to enforce code quality and security standards.
# Run with: cargo clippy --workspace -- -D warnings

# === Security & Safety ===

# Warn on unwrap() usage - should use ? or proper error handling
# This helps prevent panics in production code
disallowed-methods = [
    "std::option::Option::unwrap",
    "std::result::Result::unwrap",
]

# === Code Quality ===

# Maximum cognitive complexity for functions
cognitive-complexity-threshold = 30

# Maximum number of lines for a function
too-many-lines-threshold = 150

# === Performance ===

# Warn on inefficient operations
inline-always = true
large-enum-variant-threshold = 200

# === Documentation ===

# Require documentation for public items
missing-docs-in-private-items = false  # Only warn for public items

# === Network & Async ===

# Ensure proper async/await usage
future-not-send = "warn"
