# Jekyll configuration for Cardano Rust Node Documentation
# GitHub Pages will automatically build this site

# Site settings
title: Cardano Rust Node
description: A high-performance Cardano node implementation in Rust with 110% cryptographic accuracy
url: "https://fractionestate.github.io"
baseurl: "/cardano-rust-node"
repository: FractionEstate/cardano-rust-node

# Theme - Using Just the Docs (excellent for technical documentation)
# GitHub Pages will automatically use this theme
remote_theme: just-the-docs/just-the-docs@v0.8.0

# Color scheme - Choose from: light, dark, or custom
color_scheme: light

# Logo and branding
logo: "/assets/images/cardano-logo.png"  # Optional: add your logo

# Search settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: true

# Heading anchor links
heading_anchors: true

# Auxiliary links (top right navigation)
aux_links:
  "GitHub Repository":
    - "https://github.com/FractionEstate/cardano-rust-node"
  "Issues":
    - "https://github.com/FractionEstate/cardano-rust-node/issues"
  "Discussions":
    - "https://github.com/FractionEstate/cardano-rust-node/discussions"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: 'Copyright &copy; 2025 Cardano Rust Node. Distributed under the <a href="https://github.com/FractionEstate/cardano-rust-node/blob/main/LICENSE">MIT License</a>.'

# Footer "Edit this page" link
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/FractionEstate/cardano-rust-node"
gh_edit_branch: "001-cardano-node-rust-rewrite"
gh_edit_view_mode: "edit"

# Navigation settings
nav_sort: case_insensitive
nav_external_links:
  - title: Cardano Official
    url: https://cardano.org
  - title: Cardano Docs
    url: https://docs.cardano.org

# Callouts (for info boxes, warnings, etc.)
callouts_level: loud
callouts:
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: purple
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Code highlighting
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Collections for organizing documentation
collections:
  guides:
    output: true
    permalink: /guides/:name/
  architecture:
    output: true
    permalink: /architecture/:name/
  api:
    output: true
    permalink: /api/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "guides"
      type: "guides"
    values:
      layout: "default"
      parent: "User Guides"
  - scope:
      path: "architecture"
      type: "architecture"
    values:
      layout: "default"
      parent: "Architecture"
  - scope:
      path: "api"
      type: "api"
    values:
      layout: "default"
      parent: "API Reference"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - README.md.backup
  - "*.old"
  - "*.old2"
  - reports/archive/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings

# Plugin settings
readme_index:
  enabled: true
  remove_originals: false

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

relative_links:
  enabled: true
  collections: true

# Markdown processing
markdown: kramdown

# Compression
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false
